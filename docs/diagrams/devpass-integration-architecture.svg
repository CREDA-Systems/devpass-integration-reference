<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">DevPass Integration Reference Architecture</title>
  <desc id="desc">Flow from developer through DevPass record, identity credentials authorship and attestations, verification boundary, verification result, and authorized external consumers.</desc>

  <style>
    .box { fill: #ffffff; stroke: #222222; stroke-width: 2; rx: 10; }
    .text { font-family: Arial, sans-serif; font-size: 18px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
    .small { font-family: Arial, sans-serif; font-size: 16px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
    .line { stroke: #222222; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222222"/>
    </marker>
  </defs>

  <rect class="box" x="330" y="40" width="300" height="60"/>
  <text class="text" x="480" y="70">Developer</text>

  <line class="line" x1="480" y1="100" x2="480" y2="135"/>

  <rect class="box" x="330" y="135" width="300" height="60"/>
  <text class="text" x="480" y="165">DevPass® Record</text>

  <line class="line" x1="480" y1="195" x2="480" y2="230"/>

  <rect class="box" x="245" y="230" width="470" height="60"/>
  <text class="small" x="480" y="260">Identity / Credentials / Authorship / Attestations</text>

  <line class="line" x1="480" y1="290" x2="480" y2="325"/>

  <rect class="box" x="305" y="325" width="350" height="60"/>
  <text class="text" x="480" y="355">Verification Boundary</text>

  <line class="line" x1="480" y1="385" x2="480" y2="420"/>

  <rect class="box" x="330" y="420" width="300" height="60"/>
  <text class="text" x="480" y="450">Verification Result</text>

  <line class="line" x1="480" y1="480" x2="480" y2="520"/>
  <line x1="120" y1="520" x2="840" y2="520" stroke="#222222" stroke-width="2"/>

  <line class="line" x1="120" y1="520" x2="120" y2="570"/>
  <line class="line" x1="360" y1="520" x2="360" y2="570"/>
  <line class="line" x1="600" y1="520" x2="600" y2="570"/>
  <line class="line" x1="840" y1="520" x2="840" y2="570"/>

  <rect class="box" x="25" y="570" width="190" height="60"/>
  <text class="small" x="120" y="600">Employer</text>

  <rect class="box" x="265" y="570" width="190" height="60"/>
  <text class="small" x="360" y="600">School</text>

  <rect class="box" x="505" y="570" width="190" height="60"/>
  <text class="small" x="600" y="600">Recruiter</text>

  <rect class="box" x="745" y="570" width="190" height="60"/>
  <text class="small" x="840" y="600">Platform</text>
</svg>
